<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Page not found — Isaac Olufadewa</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; background: var(--petrol); color: #fff; padding: 2rem; }

<body>
  <div class="nf">
    <div>
      <p class="code">ERROR · 404</p>
      <h1>This node has <em>no edges</em>.</h1>
      <p>The page you were looking for isn&rsquo;t in the network. Let&rsquo;s route you back to something that is.</p>
      <a class="btn btn--solid" href="/">Return home <span class="arw">&rarr;</span></a>
    </div>
  </div>
